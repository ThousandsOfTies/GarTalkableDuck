name: GarTalkableDuck CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  product-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          make check-target
          python -m unittest discover -s tests -v
